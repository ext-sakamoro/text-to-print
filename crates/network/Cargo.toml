[package]
name = "text-to-print-network"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
hex = "0.4"
# The messages a Gallery author signs (shared with the Worker)
text-to-print-gallery-sign = { workspace = true }
# LoRA share upload backend HTTP client (GAP-3 #44).
# rustls-tls avoids the openssl dependency chain for macOS + cross-compile.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
jsonschema = { version = "0.30", default-features = false }
# Mocks the Cloudflare Worker endpoint for offline E2E tests
wiremock = "0.6"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

