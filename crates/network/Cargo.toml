[package]
name = "text-to-print-network"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libp2p = { workspace = true }
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
directories = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
alice-bamboo = { workspace = true }
hex = "0.4"
sha2 = "0.10"
# LoRA share upload backend HTTP client (GAP-3 #44).
# rustls-tls avoids the openssl dependency chain for macOS + cross-compile.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
jsonschema = { version = "0.30", default-features = false }
# Mocks the Cloudflare Worker endpoint for offline E2E tests
wiremock = "0.6"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

# cargo-machete false-positive suppression (canonical [[reference_alice_ci_canonical_template]] 罠 #3)
# 現状 unused 検出 dep は将来使用予定 or feature-gated planning のため残置
[package.metadata.cargo-machete]
ignored = ["directories", "uuid"]
