[package]
name = "text-to-print-llm"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Stage 3-C: `gguf` feature drives EmbeddedBackend GGUF parsing + tokenizer
# `parallel` enables rayon-backed matmul (~2× on desktop CPUs during prefill)
alice-llm = { workspace = true, features = ["gguf", "parallel"] }
# Stage 3-C.7: mmap the GGUF file into the process address space so the
# ~2.4 GB Qwen 3.5-4B / ~7 GB Bonsai payload doesn't inflate the resident
# working set at load time Kernel pages in on demand during inference
memmap2 = "0.9"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["process", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-stream = "0.1"

[dev-dependencies]
tempfile = "3"
