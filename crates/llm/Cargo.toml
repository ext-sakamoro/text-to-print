[package]
name = "text-to-print-llm"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Stage 3-C: `gguf` feature drives EmbeddedBackend GGUF parsing + tokenizer
# `parallel` enables rayon-backed matmul (~2× on desktop CPUs during prefill)
# `grammar` (Stage 3-C.11) exposes GBNF parser + Fsm + mask_logits_by_grammar
# so EmbeddedBackend can constrain LLM output to a formal grammar (LOL DSL)
# `gpu` (Stage 3-C.12) pulls in wgpu + GpuEngine + GpuModel for hardware-
# accelerated inference (Metal on macOS, Vulkan / DX12 elsewhere)
alice-llm = { workspace = true, features = ["gguf", "parallel", "grammar", "gpu"] }
# Stage 3-C.7: mmap the GGUF file into the process address space so the
# ~2.4 GB Qwen 3.5-4B / ~7 GB Bonsai payload doesn't inflate the resident
# working set at load time Kernel pages in on demand during inference
memmap2 = "0.9"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["process", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-stream = "0.1"
# 2026-09-12: prompt.rs::normalize_units() で cm/m/inch → mm 変換 regex 用
# (LLM に unit conversion を任せると 2-3B iGPU model で「5cm」→「5mm」誤解釈事案、
# feedback_llm_3b_complex_shape_hallucination_units_2026_09_12 参照)
regex = "1"

[dev-dependencies]
tempfile = "3"

# cargo-machete false-positive suppression (canonical [[reference_alice_ci_canonical_template]] 罠 #3)
# 現状 unused 検出 dep は将来使用予定 or feature-gated planning のため残置
[package.metadata.cargo-machete]
ignored = ["thiserror"]
