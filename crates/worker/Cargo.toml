[package]
name = "text-to-print-worker"
version = "0.1.0"
# Cargo edition is 2021 rather than the workspace-wide 2024 because this
# crate is intentionally excluded from the workspace (wasm32-only build via
# worker-build) and workspace.package.* inheritance requires membership
edition = "2021"
license = "MIT"
description = "text-to-print LoRA share upload backend (Cloudflare Workers, wasm32-unknown-unknown)"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# `d1` feature 必須 (worker 0.5 以降 D1Database / Env::d1 は feature gate)
worker = { version = "0.5", features = ["d1"] }
# Direct versions rather than `.workspace = true` because this crate is
# excluded from the workspace (see root Cargo.toml comment) Keep in loose
# sync with workspace versions when they move
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

# ── Stripe integration (Phase S1) ───────────────────────────────────
# License issuance uses the same Ed25519 payload/signature JSON format as
# `text_to_print_core::license` so that keys signed here verify with the
# existing `LicenseVerifier` on the desktop app (design B independent
# implementation, no core crate wasm32 gymnastics)
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# Utc timestamps for LicensePayload / DB rows Need `wasmbind` for
# `Utc::now()` to work under wasm32-unknown-unknown (js Date fallback)
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "wasmbind"] }
# License id + Stripe idempotency key generation `js` feature enables
# wasm-friendly randomness (js Date + Math.random fallback via getrandom)
uuid = { version = "1", features = ["v4", "js", "serde"] }
# Stripe webhook signature verification (HMAC-SHA256 over signed payload)
hmac = "0.12"
# License key base64 encoding (mirrors LicenseKey::to_base64 in core)
base64 = "0.22"
# getrandom js feature needed by uuid v4 + ed25519-dalek verifying flows
getrandom = { version = "0.2", features = ["js"] }
# Constant-time comparison for Stripe signature check
subtle = { version = "2", default-features = false }
# URL-encoding for Stripe REST body (application/x-www-form-urlencoded)
urlencoding = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
