[package]
name = "text-to-print-gallery-sign"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The desktop client (crates/network) and the Worker (crates/worker, outside the
# workspace) both build the signed messages from this crate, so the two sides can
# not drift apart The alice-* dependencies are git dependencies on branch main (the
# commits in Cargo.lock), written out because crates/worker can not inherit workspace
# dependencies
[dependencies]
alice-sign = { git = "https://github.com/ext-sakamoro/ALICE-Sign", branch = "main", version = "0.1" }
alice-serial = { git = "https://github.com/ext-sakamoro/ALICE-Serial", branch = "main", version = "0.2" }
