[package]
name = "text-to-print-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
alice-sdf = { workspace = true }
alice-bamboo = { workspace = true }
alice-physics = { workspace = true }
glam = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
rusqlite = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
directories = { workspace = true }
tracing = { workspace = true }
base64 = "0.22"
hex = "0.4"
sha2 = { workspace = true }
zip = { workspace = true }
keyring = { workspace = true }

[[bin]]
name = "gen-license-key"
path = "src/bin/gen_license_key.rs"

# headless CLI (Agent Skill 入口、JSON on stdout)
[[bin]]
name = "ttp"
path = "src/bin/ttp.rs"

[dev-dependencies]
tempfile = "3"
# 試験の build だけ zip の `time` feature を有効にする: 有効だと entry の時刻の既定は書き出した時刻になるので、
# 書き出す側が時刻を固定していなければ tests/zip_oracle.rs が落ちる
zip = { workspace = true, features = ["time"] }

# cargo-machete false-positive suppression
# 現状 unused 検出 dep は将来使用予定 or feature-gated planning のため残置
[package.metadata.cargo-machete]
ignored = ["alice-physics", "directories", "thiserror"]
