[package]
name = "core-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "3dvbgaran inference worker: LLM -> LOL DSL -> SDF -> .3mf"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json"] }
alice-lol = { path = "/Users/ys/ALICE-LOL/alice-lol" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
