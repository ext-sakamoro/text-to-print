reason = "zvariant_derive 5.15.1 (proc-macro) <- zvariant 5.15.1 <- zbus 5.19.0 / atspi <- accesskit_unix 0.24.1 <- accesskit_winit 0.34.2 <- egui-winit 0.37.0 <- eframe 0.37.0 <- text-to-print (crates/app); built for Linux targets only (cargo tree --locked --target x86_64-unknown-linux-gnu -e normal,build -i zvariant_derive@5.15.1; 0 lines for aarch64-apple-darwin and x86_64-pc-windows-msvc); no release removes it yet: accesskit_unix 0.24.1 (newest) uses zbus 5.19, and zbus 5 still pulls zvariant / zbus_names / zvariant_derive as separate crates; zbus 6 drops them; eframe 0.37 moved the hold from the 4.x versions (zbus 4.4, eframe 0.31) to these 5.x versions; no ALICE crate replaces the platform screen-reader bridge"
