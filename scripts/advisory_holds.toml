# Dated holds on RustSec advisories that cannot be fixed without a dependency
# upgrade. Each hold names the advisory, the crate version it applies to and the
# packages that depend on that version, and ends on `expires`.
#
# The advisory id is ignored in deny.toml (and, for vulnerabilities, in
# .cargo/audit.toml, which cargo audit reads). scripts/advisory_hold_guard.py keeps
# every ignore exact: it fails when the held version leaves Cargo.lock, when the
# version gains or loses a dependent, when another version of the crate is
# affected, when the hold has expired, or when the ignore lists and the holds
# disagree. Every other advisory still fails the cargo deny / cargo audit steps.
#
# kind: "vulnerability" (ignored in deny.toml and .cargo/audit.toml) or
#       "unmaintained" (deny.toml only; cargo audit reports it as a warning)
# dependents: the packages that depend on the held version directly. Only direct
#        dependents are compared: a new consumer of a recorded dependent reaches the
#        held version through the same code and passes.
# fixed: the advisory's patched ranges, copied as published (comma-separated
#        comparators, semver precedence). Other versions of the crate in Cargo.lock
#        must match one of them; a pre-release matches only a range that names a
#        pre-release of the same release. Empty when no version is safe: then every
#        version in Cargo.lock must be held.

# zvariant / zbus_names / zvariant_derive are no longer published as separate
# crates (merged into zbus 6). zbus 5.19 comes from eframe 0.37 (egui-winit ->
# accesskit_winit -> accesskit_unix -> atspi, the Linux screen-reader bridge), on
# Linux only. No version of these crates is safe.
[[hold]]
id = "RUSTSEC-2026-0370"
kind = "unmaintained"
crate = "zvariant"
version = "5.15.1"
dependents = [
    "accesskit_atspi_common 0.21.1",
    "atspi-common 0.13.0",
    "zbus 5.19.0",
    "zbus-lockstep 0.5.2",
    "zbus-lockstep-macros 0.5.2",
    "zbus_macros 5.19.0",
    "zbus_names 4.3.5",
    "zbus_xml 5.2.1",
]
fixed = []
expires = "2026-12-18"
until = "accesskit_unix > 0.24.1 on zbus 6"
reason = "zvariant 5.15.1 <- (accesskit_atspi_common 0.21.1, atspi-common 0.13.0, zbus 5.19.0, zbus-lockstep 0.5.2, zbus_macros 5.19.0, zbus_names 4.3.5, zbus_xml 5.2.1) <- atspi 0.29.0 / atspi-common 0.13.0 / atspi-proxies 0.13.0 <- accesskit_unix 0.24.1 <- accesskit_winit 0.34.2 <- egui-winit 0.37.0 <- eframe 0.37.0 <- text-to-print (crates/app); compiled on Linux only (cargo tree --locked --target x86_64-unknown-linux-gnu -e normal,build -i zvariant@5.15.1; 0 lines for aarch64-apple-darwin and x86_64-pc-windows-msvc); no release removes it yet: accesskit_unix 0.24.1 (newest) uses zbus 5.19, and zbus 5 still pulls zvariant / zbus_names / zvariant_derive as separate crates; zbus 6 drops them; eframe 0.37 moved the hold from the 4.x versions (zbus 4.4, eframe 0.31) to these 5.x versions; no ALICE crate replaces the platform screen-reader bridge"
until_release = [{crate = "accesskit_unix", newer_than = "0.24.1"}]

