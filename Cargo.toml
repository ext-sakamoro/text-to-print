[workspace]
members = [
    "crates/app",
    "crates/core",
    "crates/llm",
    "crates/network",
]
# `crates/worker` is intentionally excluded from the default workspace so that
# `cargo test`, `cargo clippy`, and desktop release builds don't try to
# compile a wasm32-only crate. Build it with:
#   cd crates/worker && wrangler dev      (invokes worker-build → wasm32)
# or `cargo build --manifest-path crates/worker/Cargo.toml --target wasm32-unknown-unknown`
exclude = ["crates/worker"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# ALICE ecosystem
# Stage 4 (2026-08-01): alice-lol was removed as a direct dep — text-to-print
# now consumes parse_lol / print_export / to_wgsl through alice-bamboo
# re-exports (alice-bamboo has `wgsl` feature default-on so `to_wgsl` is
# exposed uniformly)
alice-sdf = { path = "../ALICE-SDF" }
alice-view = { path = "../ALICE-View", default-features = false }
alice-llm = { path = "../ALICE-LLM", default-features = false }
alice-bamboo = { path = "../ALICE-Bamboo" }
alice-physics = { path = "../ALICE-Physics" }

# GUI
eframe = { version = "0.31", features = ["wgpu"] }
egui = "0.31"

# async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# database
rusqlite = { version = "0.31", features = ["bundled"] }

# crypto
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

# P2P
libp2p = { version = "0.54", features = [
    "gossipsub",
    "kad",
    "identify",
    "mdns",
    "noise",
    "tcp",
    "quic",
    "yamux",
    "tokio",
    "macros",
] }

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# utils
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
directories = "6"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"

# internal
text-to-print-core = { path = "crates/core" }
text-to-print-llm = { path = "crates/llm" }
text-to-print-network = { path = "crates/network" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
