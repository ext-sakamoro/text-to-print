# cargo-deny 設定 (v0.14+ schema)
# canonical CI template: [[reference_alice_ci_canonical_template]]

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
# text-to-print 側 CVE ignore の canonical は .cargo/audit.toml (ci.yml audit job 用)
# 本 deny.toml と同期を保つ (両方 update する時は忘れず片側に反映)
ignore = [
    # libp2p 0.54 transitive chain (.cargo/audit.toml と同期)
    "RUSTSEC-2026-0119",  # hickory-proto v0.24
    "RUSTSEC-2026-0194",  # quick-xml v0.30
    # 追加 unmaintained + CVE (libp2p 0.54 chain 拡張、canonical 罠 #15)
    "RUSTSEC-2024-0384",  # instant unmaintained (libp2p transitive)
    "RUSTSEC-2024-0436",  # paste unmaintained (pyo3-macros transitive)
    "RUSTSEC-2025-0009",  # AES panic (libp2p transitive、overflow-checked のみ)
    "RUSTSEC-2025-0010",  # ring < 0.17 unmaintained (libp2p transitive)
    "RUSTSEC-2026-0098",  # (libp2p chain)
    "RUSTSEC-2026-0099",  # (libp2p chain)
    "RUSTSEC-2026-0104",  # (libp2p chain)
    "RUSTSEC-2026-0192",  # ttf-parser unmaintained (egui transitive)
    "RUSTSEC-2026-0195",  # quick-xml DoS (libp2p chain)
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
    "OpenSSL",
]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "webpki"
version = "*"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
