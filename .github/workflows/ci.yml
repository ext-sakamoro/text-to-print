name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - name: Check formatting
        run: |
          cargo fmt --manifest-path crates/app/Cargo.toml -- --check
          cargo fmt --manifest-path crates/core/Cargo.toml -- --check
          cargo fmt --manifest-path crates/llm/Cargo.toml -- --check
          cargo fmt --manifest-path crates/network/Cargo.toml -- --check
