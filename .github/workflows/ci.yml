name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      # workspace の path 依存 (ALICE-xxx) が CI 上にないため
      # fmt は各クレート個別にチェック
      - run: |
          for dir in crates/app crates/core crates/llm crates/network; do
            echo "=== $dir ==="
            cd $dir && cargo fmt -- --check && cd ../..
          done
