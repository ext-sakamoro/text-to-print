name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Security audit (#40): scan Cargo.lock against the RustSec advisory
  # database Runs quickly (<20s) — pure lockfile audit, no compile
  #
  # Uses `cargo audit` directly instead of `rustsec/audit-check@v2` so
  # the ignore list in `.cargo/audit.toml` (with per-entry rationale)
  # is respected identically to local `cargo audit` invocations Every
  # entry there must document why the vulnerable dep is unavoidable
  # (typically pinned by libp2p 0.54 / wgpu / ALICE-* upstreams)
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit (honours .cargo/audit.toml ignore list)
        run: cargo audit

  # clippy / test / doc need the six ALICE-* sibling repos side-by-side
  # (matches the workspace path deps) Public Project-ALICE repos are
  # cloned unauthenticated; private ext-sakamoro repos require a PAT with
  # `contents: read` on the private repos to be set as the
  # `ALICE_ECO_TOKEN` secret Without the token the private-repo checkout
  # steps fail and the job as a whole surfaces as red — that is the
  # intentional signal that the workflow needs one-time DevOps setup
  #
  # ── ALICE_ECO_TOKEN 設定手順 ────────────────────────────
  # 1. https://github.com/settings/tokens?type=beta で Fine-grained PAT 発行
  #    - Resource owner: `ext-sakamoro`
  #    - Repository access: `ext-sakamoro/ALICE-Bamboo` (最低限)
  #    - Repository permissions: `Contents: Read-only`
  # 2. https://github.com/ext-sakamoro/text-to-print/settings/secrets/actions
  #    に "New repository secret" で `ALICE_ECO_TOKEN` = 発行した PAT を登録
  # 3. 次 push で clippy-test-doc job が checkout ステップを通過することを確認
  clippy-test-doc:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: text-to-print
    steps:
      - name: Checkout text-to-print
        uses: actions/checkout@v5
        with:
          path: text-to-print

      # ALICE ecosystem repos — canonical org は `ext-sakamoro`
      # 5 public (SDF/LOL/View/LLM/Physics) + 1 private (Bamboo)
      # 旧 `Project-ALICE/*` 参照は 2026-08-06 修正 (repo 存在せず 404、CI ずっと red)
      - name: Checkout ALICE-SDF
        uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-SDF
          path: ALICE-SDF
      - name: Checkout ALICE-LOL
        uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-LOL
          path: ALICE-LOL
      - name: Checkout ALICE-View
        uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-View
          path: ALICE-View
      - name: Checkout ALICE-LLM
        uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-LLM
          path: ALICE-LLM
      - name: Checkout ALICE-Physics
        uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Physics
          path: ALICE-Physics

      # Private repos (Bamboo / Print) — requires `ALICE_ECO_TOKEN` secret
      # ALICE-Bamboo は alice-print を path dep で参照するので、両方
      # checkout しないと workspace 解決が fail する PAT の Repository
      # access は両 repo を include している必要あり
      - name: Checkout ALICE-Bamboo (private)
        uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Bamboo
          path: ALICE-Bamboo
          token: ${{ secrets.ALICE_ECO_TOKEN }}
      - name: Checkout ALICE-Print (private)
        uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Print
          path: ALICE-Print
          token: ${{ secrets.ALICE_ECO_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Linux: keyring crate は libdbus-sys 経由で libdbus-1-dev を要求
      # (Secret Service backend) Windows/macOS は不要
      - name: Install libdbus-1-dev (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: text-to-print

      # fmt を clippy と同 job に merge (2026-08-07): 独立 `fmt` job は
      # workspace path deps (ALICE-Bamboo private) の checkout なしで
      # Windows で `cargo fmt --all` が manifest 解決 fail していた
      # ALICE-* 全て揃った状態なら fmt/clippy/test 全部素直に流れる
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (workspace lib)
        run: cargo test --workspace --lib

      - name: cargo doc (no deps)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps

  # wasm32 build check for `crates/worker` (Cloudflare Workers upload backend)
  #
  # `crates/worker` は workspace から除外されている (wasm32-only + edition 2021)
  # ため main clippy-test-doc job では検証されない この job が無いと deploy 直前
  # まで壊れが surface しないので、fast wasm build check だけ実施する
  #
  # Ubuntu 単体で十分 (wasm target は OS 非依存) `wrangler deploy` は本 job で
  # 実行せず、check pass 後に手動で trigger する運用
  check-wasm-worker:
    name: check-wasm (crates/worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/worker
      - name: cargo check --target wasm32-unknown-unknown
        working-directory: crates/worker
        run: cargo check --target wasm32-unknown-unknown --release
