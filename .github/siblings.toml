# ALICE-* sibling の固定 commit
#
# text-to-print は ALICE-* を `../ALICE-Xxx` の path 依存で引く CI は以前 sibling の
# default branch (main) をそのまま checkout していたため、sibling 側の版の切り替え
# (例: alice-zip 0.10 と、それをまだ 0.9 で要求する alice-lol が同時に main に並ぶ
# 期間) に text-to-print の CI が巻き込まれ、再現もできなかった
#
# 本 file の commit をそのまま checkout する (`.github/actions/alice-siblings`)
#   - 載せる sibling の集合は `cargo metadata` の解決結果と一致させる
#     (`scripts/ci_sibling_checkout_check.py` が過不足を fail にする)
#   - 更新は 1 本ずつでなく集合ごと動かす: 全 commit を差し替え → `cargo metadata`
#     が解決すること → build / test → `Cargo.lock` を同じ commit で更新 →
#     出力 mesh の hash の変化を記録する
#   - 値は 40 桁の commit SHA (branch 名や短縮 SHA は不可)

[meta]
updated = "2026-10-12"
reason = "alice-zip 0.10 (alice-det-math 0.5) と、0.9 / 0.4 を要求する sibling が main に混在する期間の前で、互いに解決する最新の組"

